review()">预览创作方案</button></section><div class=between><h2>找个灵感开始</h2><button class=link onclick="switchTab(&quot;灵感&quot;)">查看全部</button></div><button class=hero onclick="sample(0)"><img src="'+TEA+'" alt=""><strong>抹茶拿铁<br>上新海报</strong><span>查看茶饮样张</span></button><button class=minirow onclick="sample(1)"><img src="'+rows[1].img+'"><span><b>周末试驾</b><small>汽车海报</small></span></button>'}
const $=s=>document.querySelector(s), dlg=$('dialog'), content=$('.content');let kind='海报',ratio='3:4',res='1080',dpi='300',pick=0,brief='',cat='全部',upload='',tab='主页',formats={};
function editKind(x){brief=$('#request').value;saveFormat();setKind(x);edit()}
const opts=(xs,v)=>xs.map(x=>'<option '+(x===v?'selected':'')+'>'+x+'</option>').join('');
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const buttons=()=>'<div class=pills>'+['海报','文案','短片'].map(x=>'<button class="'+(x===kind?'on':'')+'" onclick="setKind(this.textContent)">'+x+'</button>').join('')+'</div>';
function setKind(x){formats[kind]={ratio,res,dpi};kind=x;({ratio,res,dpi}=formats[x]||{ratio:x==='短片'?'9:16':'3:4',res:x==='短片'?'720':'1080',dpi:'300'});render()}
function spec(){return kind==='文案'?'文案 · TXT':ratio+' · '+res+' px'+(kind==='海报'?' · '+dpi+' DPI':' · 9 秒')}
function cards(list){return '<div class=grid>'+list.map(r=>'<button class=card onclick="sample('+rows.indexOf(r)+')"><img src="'+r.img+'" alt="'+r.title+'海报"><b>'+r.title+'</b><small>'+r.cat+'海报</small></button>').join('')+'</div>'}
function gallery(){return '<div class=between><h1>灵感选集</h1><button class=link onclick="edit()">自主创作</button></div><div class=pills>'+['全部',...rows.map(r=>r.cat)].map(x=>'<button class="'+(cat===x?'on':'')+'" onclick="cat=this.textContent;render()">'+x+'</button>').join('')+'</div>'+cards(rows.filter(r=>cat==='全部'||r.cat===cat))}
function show(title,html){$('#panelTitle').textContent=title;$('#panel').innerHTML=html;if(!dlg.open)dlg.showModal()}
function sample(i){pick=i;const r=rows[i];show(r.title,'<img class=smallpic src="'+r.img+'"><p>'+esc(r.brief)+'</p><button class=primary onclick="useSample()">用这个方向创作</button>')}
function useSample(){brief=rows[pick].brief;render();edit()}
function formatFields(){return kind==='文案'?'': '<label>画幅<select id=ratio>'+opts(['3:4','1:1','9:16','4:5','16:9'],ratio)+'</select></label><label>短边分辨率 · px<select id=res>'+opts(['720','1080','2160'],res)+'</select></label>'+(kind==='海报'?'<label>印刷精度 · DPI<select id=dpi>'+opts(['72','150','300'],dpi)+'</select></label>':'')}
function saveFormat(){ratio=$('#ratio')?.value||ratio;res=$('#res')?.value||res;dpi=$('#dpi')?.value||dpi}
function format(){show('输出规格',formatFields()+'<button class=primary onclick="saveFormat();dlg.close();render()">确定</button>')}
function edit(){show('创作需求','<label>作品类型<select onchange="editKind(this.value)">'+opts(['海报','文案','短片'],kind)+'</select></label><label>想推广什么？<textarea id=request placeholder="写下商品、卖点和希望顾客做的事"></textarea></label><label class=file>添加商品图<input type=file accept="image/*" onchange="upload=this.files[0]?.name||&quot;&quot;"></label>'+formatFields()+'<button class=primary onclick="fromEdit()">预览方案</button>');$('#request').value=brief}
function fromEdit(){brief=$('#request').value.trim();saveFormat();if(!brief){$('#request').focus();return}render();review()}
function review(){if(!brief.trim()){edit();return}show('方案预览','<p class=review>'+esc(brief)+'</p><p class=review>'+kind+'　'+spec()+'</p>'+(upload?'<p class=review>素材　'+esc(upload)+'</p>':'')+'<p class=review>预计用量　'+({'海报':4,'文案':0,'短片':12}[kind])+' 积分</p><p class=sub>交互样稿，仅预览方案。</p><button class=primary onclick="edit()">返回调整</button>')}
function switchTab(t){tab=t;cat='全部';render();scrollTo(0,0)}
function render(){const r=rows[pick];if(tab==='灵感')content.innerHTML=gallery();else if(tab==='我的')content.innerHTML='<h1>我的作品</h1><p class="sub topgap">作品生成后会保存在这里。</p><button class="primary topgap" onclick="switchTab(&quot;主页&quot;);edit()">新建作品</button>';else content.innerHTML=home(r);if($('#prompt'))$('#prompt').value=brief;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
render();
</script></body></html>
