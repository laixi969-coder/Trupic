<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>看图开工 · 响指出片</title>
<style>
:root {color-scheme:dark; --bg:#1b1e1c;--ink:#f3f5ed;--muted:#bbc0b9;--line:#434942;--green:#d7f694;--deep:#181b18;--radius:10px;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft Yahei",sans-serif;}
*{box-sizing:border-box}
body{margin:0;background:#101310;color:var(--ink);-webkit-font-smoothing:antialiased}
button, textarea, input{font:inherit}
button{cursor:pointer;color:inherit;touch-action:manipulation}
button:focus-visible, textarea:focus-visible, label:focus-within{outline:2px solid var(--green);outline-offset:3px}
button:disabled{opacity:.45;cursor:default}
button svg, .mark-icon, .status-icon {width:20px;height:20px;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.65;flex-shrink:0}
button svg, .mark-icon, .status-icon{display:block}
.app{width:100%;max-width:430px;min-height:100vh;min-height:100svh;margin:0 auto;background:var(--bg);box-shadow:0 0 0 1px #303630}
.header{height:56px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #343a34;background:#1c201d}
.brand{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:675;letter-spacing:.02em}
.brand img{width:29px;height:29px;display:block}
.app-role{font-size:12px;color:#c1c7bd;letter-spacing:.05em}
.brand-back{display:inline-flex;align-items:center;gap:4px;border:0;background:transparent;font-size:14px;padding:0 8px 0 0;min-height:44px}
.stage-name{font-size:15px;font-weight:650}
.photo{height:clamp(330px,54svh,482px);position:relative;isolation:isolate;overflow:hidden;background:#827963}
.photo img{position:absolute;width:100%;height:100%;inset:0;object-fit:cover;object-position:61% 50%}
.photo:after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(9,13,9,.19),transparent 20%,transparent 61%,rgba(10,13,11,.60) 100%)}
.corner{position:absolute;width:13px;height:13px;border-color:#eff3e3;border-style:solid;z-index:1;opacity:.86;pointer-events:none}
.t-l{top:12px;left:12px;border-width:1px 0 0 1px}.t-r{top:12px;right:12px;border-width:1px 1px 0 0}.b-l{bottom:12px;left:12px;border-width:0 0 1px 1px}.b-r{bottom:12px;right:12px;border-width:0 1px 1px 0}
.photo-tag{position:absolute;top:22px;left:23px;z-index:2;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.05em;text-shadow:0 1px 4px #30302b}
.photo-tag svg{width:16px;height:16px}
.photo-info{position:absolute;bottom:24px;left:24px;right:24px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;z-index:2}
.photo-info p{margin:0 0 4px;font-size:13px;font-weight:560;letter-spacing:.08em}
.photo-info h2{margin:0;font-weight:700;letter-spacing:-.06em;font-size:39px;line-height:1.12;color:white}
.replace{min-height:44px;border:1px solid #e5eadc7a;border-radius:22px;background:#17201787;color:#fff;padding:0 14px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:13px;white-space:nowrap;backdrop-filter:blur(10px)}
.replace svg{width:17px;height:17px}
.console{padding:22px 20px 20px;background:linear-gradient(160deg,#262b26,#1d211e 70%);border-top:1px solid #424840}
.heading-row{display:flex;align-items:center;gap:10px;justify-content:space-between}
h1{font-size:24px;line-height:1.32;letter-spacing:-.035em;margin:0;font-weight:690}
.edit-label{display:block}
textarea{display:block;resize:vertical;border:1px solid #4b514a;background:#171b18;width:100%;min-height:82px;margin:14px 0 12px;border-radius:9px;padding:12px 14px;color:#ecf0e7;font-size:15px;line-height:1.6}
textarea::placeholder{color:#b2bbb1}
.control-row, .dual{display:grid;grid-template-columns:.92fr 1.08fr;gap:9px}
.key{min-height:50px;border:1px solid #555d52;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;gap:9px;background:#30362f;font-size:15px;font-weight:630;padding:8px 12px}
.key.primary{background:var(--green);border-color:var(--green);color:#1f2c14}
.key:active,.replace:active,.choice:active{transform:translateY(1px)}
button[data-voice-button][aria-pressed="true"]{background:#3b4b32;border-color:var(--green)}
.status{font-size:12px;line-height:1.5;color:var(--muted);margin:12px 0 0;min-height:18px}
.status:empty{display:none}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.file{display:none}
.work{padding:24px 20px 26px}
.work h1{font-size:28px}
.work p{overflow-wrap:anywhere}
.sub{font-size:14px;color:var(--muted);line-height:1.65;margin:8px 0 20px}
.context{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid #3c423b;background:#252a25}
.context img{width:54px;height:59px;object-fit:cover;border-radius:4px;flex:none}
.context b{display:block;font-size:15px;font-weight:650;margin:0 0 3px}
.context p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0;font-size:13px;color:#c3cac0;line-height:1.55;overflow-wrap:anywhere}
.picks{border-top:1px solid var(--line);margin:18px 0 22px}
.choice{width:100%;display:grid;grid-template-columns:1fr 22px;align-items:center;gap:10px;text-align:left;padding:16px 4px;min-height:70px;background:transparent;border:0;border-bottom:1px solid var(--line)}
.choice span{display:block}.choice small,.tagline{font-size:12px;font-weight:550;color:var(--muted)}
.choice strong{display:block;margin-top:6px;font-size:17px;line-height:1.5;font-weight:630}
.radio{width:19px;height:19px;border:1px solid #6e796c;border-radius:50%;display:grid!important;place-items:center}
.choice[aria-checked="true"] .radio{background:var(--green);border-color:var(--green)}
.choice[aria-checked="true"] .radio:after{content:"";width:7px;height:7px;border-radius:50%;background:#29361d}
.choice[aria-checked="true"] small{color:var(--green)}
.full{width:100%}
.proof{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 0;margin-top:18px}
.proof h2{font-size:22px;line-height:1.45;letter-spacing:-.03em;margin:6px 0 7px}
.proof p{margin:0;font-size:15px;line-height:1.7;color:#d3d8d0}
.price{display:flex;justify-content:space-between;align-items:baseline;padding:22px 0 8px;font-size:15px}
.price b{font-size:34px;color:var(--green);line-height:1}
.price b small{font-size:14px;font-weight:550}
.notice{font-size:12px;line-height:1.65;color:var(--muted);margin:0 0 20px}
.poster{display:block;width:min(100%,285px);height:auto;margin:18px auto 0}
.clip-text{user-select:all}
@media(min-width:550px){.app{min-height:100svh}.console{padding-bottom:26px}}
@media(max-width:350px){.header{padding:0 14px}.console,.work{padding-left:15px;padding-right:15px}.key{font-size:14px;gap:6px}.photo-info h2{font-size:34px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

.app:has(.console){display:flex;flex-direction:column}
.app:has(.console) .header,.app:has(.console) .photo{flex-shrink:0}
.photo-tag{background:#111911ba;border:1px solid #ffffff32;backdrop-filter:blur(8px);text-shadow:none;padding:4px 8px;border-radius:5px;top:21px;left:22px}
.photo-info h2{font-size:40px}
.console{flex:1;display:flex;flex-direction:column;background:#202320;padding:22px 20px max(27px,env(safe-area-inset-bottom));}
.console h1{font-size:26px}
.draft{background:#171a17;border:1px solid #474d46;border-radius:9px;margin:19px 0 17px;padding:15px 14px 14px}
.draft:focus-within{border-color:var(--green)}
.draft-caption{display:flex;align-items:center;gap:5px;color:#b8c0b5;font-size:12px;line-height:16px}
.draft-caption svg{width:13px;height:13px}
.draft textarea{min-height:57px;padding:0;border:0;background:transparent;line-height:1.65;resize:none;margin:6px 0 0;font-size:16px;border-radius:0}
.draft textarea:focus-visible{outline:0}
.control-row{grid-template-columns:1.06fr 1fr;gap:10px;margin-top:auto}
.control-row .key{height:59px;font-size:16px;gap:10px;border-color:#5d655b;background:#303630;box-shadow:inset 0 1px 0 #ffffff12,0 2px 0 #111411}
.control-row .key.primary{background:#e1e6d9;border-color:#e3e8dc;color:#1b2119}
.mic-face{width:33px;height:33px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#23301d}
.mic-face svg{width:19px;height:19px;stroke-width:1.8}
.control-row .primary svg{height:18px;width:18px}
@media(max-height:740px){.console{padding-top:18px}.draft{margin:12px 0}.control-row .key{height:52px}}
@media(min-height:900px){.console{justify-content:flex-start}.control-row{margin-top:6px}}
</style>
<style>h1,h2,h3{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style></head>

}
function context(){
  return '<aside class="context"><img alt="" src="'+state.pic+'"><div><b>本次需求</b><p>'+safe(state.text)+'</p></div></aside>';
}
function picks(){
  return header('选文案')+context()+'<section class="work"><h1>哪句适合这张图？</h1><p class="sub">试选一组可颂示例文案，下一步核对报价。</p><div class="picks" role="radiogroup" aria-label="可颂示例文案">'+options.map((item,i)=>'<button class="choice" role="radio" aria-checked="'+(i===state.picked)+'" data-pick="'+i+'"><span><small>'+angles[i]+'</small><strong>'+safe(item.title)+'</strong></span><span class="radio" aria-hidden="true"></span></button>').join('')+'</div><button class="key primary full" data-act="quote">核对报价</button></section>';
}
function proof(){
  const item = options[state.picked];
  return '<div class="proof"><span class="tagline">发布文案</span><h2>'+safe(item.title)+'</h2><p class="clip-text">'+safe(item.cta)+'</p></div>';
}
function quote(){
  return header('确认任务')+context()+'<section class="work"><h1>确认这次出片</h1>'+proof()+'<div class="price"><span>海报制作报价</span><b>4 <small>积分</small></b></div><p class="notice">本地演示，确认后查看示例交付，不会扣除积分。</p><div class="dual"><button class="key" data-act="select">重新选稿</button><button class="key primary" data-act="finish">确认并查看</button></div></section>';
}
function result(){
  const real = state.picked===1 && !state.custom && state.text.trim()===example;
  return header('交付预览')+'<section class="work"><h1>'+(real?'海报作品':'发布文案')+'</h1><p class="sub">'+(real?'街角面包房这组示例任务的成品。':'所选示例文案已就绪，可复制后继续编辑。')+'</p>'+(real?'<img class="poster" src="'+deliverable+'" alt="街角面包房可颂海报，标题为可颂，刚下班的邻居邀请你">':'')+proof()+'<div class="dual" style="margin-top:20px"><button class="key" data-act="new">回到需求</button><button class="key primary" data-act="copy">'+icon('copy')+'复制文案</button></div><p class="status" id="copy-status" aria-live="polite"></p></section>';
}
function render(){
  const views={brief,picks,quote,result};
  app.innerHTML=views[state.stage]();
}
function go(stage){
  state.stage=stage;render();window.scrollTo(0,0);document.documentElement.scrollTop=0;
  const title=app.querySelector('h1');
  if(title){title.setAttribute('tabindex','-1');title.focus({preventScroll:true})}
}
app.addEventListener('input', e => {if(e.target.matches('[data-voice-input]'))state.text=e.target.value});
app.addEventListener('submit', e => {
  if(e.target.id!=='brief')return;e.preventDefault();
  const box=app.querySelector('[data-voice-input]');state.text=box.value.trim();
  if(!state.text){app.querySelector('[data-voice-status]').textContent='写下需求，或点击说需求后再发送。';box.focus();return}
  go('picks');
});
app.addEventListener('change', async e=>{
  if(e.target.id!=='file')return;
  const file=e.target.files[0];if(!file)return;
  const status=app.querySelector('[data-voice-status]');
  const url=URL.createObjectURL(file);
  const image=new Image();
  try{
    image.src=url;await image.decode();
    if(state.stage!=='brief'){URL.revokeObjectURL(url);return}
    const old=state.pic;state.pic=url;state.custom=true;
    render();if(old!==source)URL.revokeObjectURL(old);
    app.querySelector('[data-voice-status]').textContent='已换成本地照片。';
  }catch{URL.revokeObjectURL(url);status.textContent='无法打开这张照片，请重新选择。'}
});
app.addEventListener('keydown', e=>{
  const radio=e.target.closest('[data-pick]');
  if(!radio||!['ArrowDown','ArrowRight','ArrowUp','ArrowLeft'].includes(e.key))return;
  e.preventDefault();const delta=['ArrowDown','ArrowRight'].includes(e.key)?1:-1;
  const target=(Number(radio.dataset.pick)+delta+options.length)%options.length;
  const button=app.querySelector('[data-pick="'+target+'"]');button.click();button.focus();
});
app.addEventListener('click', async e=>{
  const pick=e.target.closest('[data-pick]');
  if(pick){
    state.picked=Number(pick.dataset.pick);
    app.querySelectorAll('[data-pick]').forEach(btn=>btn.setAttribute('aria-checked',String(btn===pick)));
    return;
  }
  const button=e.target.closest('[data-act]');if(!button)return;
  switch(button.dataset.act){
    case 'upload': app.querySelector('#file').click();break;
    case 'back': go(({picks:'brief',quote:'picks',result:'quote'})[state.stage]);break;
    case 'select':go('picks');break;
    case 'quote':go('quote');break;
    case 'finish':go('result');break;
    case 'new':go('brief');break;
    case 'copy':{
      const item=options[state.picked], value=item.title+'\n'+item.cta, status=app.querySelector('#copy-status');
      try{
        if(navigator.clipboard){await navigator.clipboard.writeText(value)}
        else{
          const textarea=document.createElement('textarea');textarea.value=value;app.appendChild(textarea);
          textarea.select();const copied=document.execCommand('copy');textarea.remove();if(!copied)throw Error();
        }
        status.textContent='已复制发布文案。';
      }catch{status.textContent='请长按上方文案，选择文字后复制。'}
      break;
    }
  }
});
render();
</script>
<script>
(() => {
  let current = null;
  const speechErrors = {
    "not-allowed": "麦克风未获授权。可以在浏览器设置中允许录音，或直接打字。",
    "service-not-allowed": "浏览器暂不能调用语音服务，可以直接打字。",
    "audio-capture": "没有检测到可用麦克风，可以连接后重试或打字。",
    "no-speech": "没有听清，可以再说一次，或直接打字。",
    network: "语音服务连接失败，可以重试或直接打字。",
    "language-not-supported": "当前语音服务不支持中文听写，可以直接打字。"
  };
  function finish(s, message) {
    if (s !== current) return;
    current = null;
    s.button.setAttribute("aria-pressed", "false");
    s.button.removeAttribute("data-listening");
    if (s.originalAria) s.button.setAttribute("aria-label", s.originalAria);
    else s.button.removeAttribute("aria-label");
    if (s.label) s.label.textContent = s.originalLabel;
    if (message && s.status.isConnected) s.status.textContent = message;
  }
  function cancel() {
    if (!current) return;
    const s = current;
    finish(s, "本次语音输入已结束。");
    try { s.rec.abort(); } catch {}
  }
  function visible(node) { return node && node.getClientRects().length > 0; }
  function visibleTarget(selector) {
    return [...document.querySelectorAll(selector)].find(visible);
  }
  document.addEventListener("click", e => {
    const button = e.target.closest("[data-voice-button]");
    if (!button) return;
    e.preventDefault();
    const label = button.querySelector("[data-voice-label]");
    const scope = button.closest("[data-voice-scope]") || document;
    const input = scope.querySelector("[data-voice-input]") || visibleTarget("[data-voice-input]");
    const status = scope.querySelector("[data-voice-status]") || visibleTarget("[data-voice-status]");
    if (!input || !status) return;
    if (current?.button === button) {
      status.textContent = "正在整理语音…";
      try { current.rec.stop(); } catch { cancel(); }
      return;
    }
    cancel();
    const Recognizer = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Recognizer || !window.isSecureContext) {
      status.textContent = "这个浏览器暂不支持语音转写。可以使用键盘听写，或直接输入文字。";
      input.focus();
      return;
    }
    let rec;
    try { rec = new Recognizer(); }
    catch { status.textContent = "语音服务暂时无法启动。可以直接输入文字。"; input.focus(); return; }
    const s = {rec, input, status, button, label, originalAria: button.getAttribute("aria-label"), originalLabel: label?.textContent, text: new Map()};
    current = s;
    rec.lang = "zh-CN";
    rec.continuous = false;
    rec.interimResults = true;
    const transcript = () => [...s.text.entries()].sort(([a],[b])=>a-b).map(([,v])=>v).join("").trim();
    rec.onstart = () => {
      if (current !== s) return;
      status.textContent = "在听，说完后点结束。";
    };
    rec.onresult = event => {
      if (current !== s) return;
      for (let i=event.resultIndex; i<event.results.length; i++) s.text.set(i,event.results[i][0].transcript);
      status.textContent = transcript() || "在听…";
    };
    rec.onerror = event => finish(s, speechErrors[event.error] || "语音输入中断，可以再试一次或直接打字。");
    rec.onend = () => {
      if (current !== s) return;
      if (!s.input.isConnected || !visible(button)) { finish(s); return; }
      const spoken = transcript();
      if (!spoken) { finish(s, "没有听到文字，可以再说一次或打字。"); return; }
      const max = s.input.maxLength > 0 ? s.input.maxLength : 1200;
      const combined = s.input.value + spoken;
      const draft = combined.slice(0, max);
      finish(s, combined.length > max ? "已达到字数上限，请核对草稿后发送。" : "已转成文字，可以修改后发送。");
      s.input.value = draft;
      s.input.dispatchEvent(new Event("input", {bubbles:true}));
    };
    status.textContent = "正在打开麦克风…";
    button.setAttribute("data-listening", "");
    button.setAttribute("aria-pressed", "true");
    button.setAttribute("aria-label", "结束语音输入");
    if (label) label.textContent = "结束录音";
    try { rec.start(); } catch { finish(s, "无法启动麦克风，可以重试或打字。"); }
  });
  new MutationObserver(() => {
    if (current && (!visible(current.button) || !current.input.isConnected)) cancel();
  }).observe(document.body, {subtree:true,childList:true,attributes:true,attributeFilter:["hidden","class","style"]});
  document.addEventListener("visibilitychange", () => { if (document.hidden) cancel(); });
  window.addEventListener("pagehide",cancel);
})();

</script>
</body>
