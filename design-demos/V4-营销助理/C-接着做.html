function inputPanel(value,edit=false){return '<div class="input-shell'+(edit?' editbox':'')+'"><textarea aria-label="营销需求" data-voice-input maxlength="1200" rows="'+(edit?'4':'1')+'" placeholder="说说店里想推广什么…">'+esc(value)+'</textarea><div class="compose-actions"><button class="voice" type="button" data-voice-button>'+icon('mic')+'<span data-voice-label>说需求</span></button><button class="send" data-do="send" '+(!value.trim()?'disabled':'')+'>'+icon('send')+(edit?'保存并选稿':'发送')+'</button></div></div><p class="voice-status" aria-live="polite" data-voice-status></p>'}
function home(){
 const t=current(),ready=t.stage==='quote',done=t.stage==='done',pending=records.filter(x=>x.stage!=='done').length;
 const caption=done?'已完成交付':ready?'文案已选定':'待选择文案',next=done?'查看交付':ready?'核对报价':'选择文案';
 const preview= t.choice===1&&t.stage!=='copy'?art.poster:art.bakery;
 const more=records.filter(item=>item.id!==activeId);
 return header()+'<main><div class="heading"><h1>'+(done?'最近交付':'待你确认')+'</h1>'+(!done?'<span class="quantity" aria-label="'+pending+'个待处理任务">'+pending+'</span>':'')+'</div><article class="job-card"><div class="card-top"><span class="stage">'+icon(done?'check':ready?'check':'edit')+caption+'</span><h2>'+esc(t.request===original?'可颂出炉海报':t.request)+'</h2><p class="store">'+(t.request===original?'街角面包房':'面包房选稿样例')+'</p><button class="preview" data-do="preview" aria-label="查看样例图"><img class="print" src="'+preview+'" alt=""></button></div><div class="card-bottom">'+(ready?'<div class="cost" aria-label="报价 '+quote+' 积分"><span class="cost-caption">报价</span><b>'+quote+'</b><span>积分</span></div>':'<span class="bottom-hint">'+(done?labels[t.choice]+'文案':'三组候选文案')+'</span>')+'<button class="green-button" data-do="resume">'+next+'</button></div></article><section class="history"><div class="section-line"><h2>工作记录</h2><span>最近在前</span></div><div class="log">'+(done?row('delivery','海报已交付',labels[t.choice]+'发布文案与海报','layers'):'')+(t.stage!=='copy'?row('record-copy','已选'+labels[t.choice]+'文案',candidates[t.choice].title,'check'):'')+row('alternatives','三组候选文案','查看海报标题与发布文案','layers')+row('request','提交海报需求',t.request===original?'可颂下午四点出炉，邀请刚下班的邻居。':t.request,'doc')+'</div></section>'+(more.length?'<section class="past"><div class="section-line"><h2>其他任务</h2></div>'+more.map(item=>'<button class="row" data-task="'+esc(item.id)+'"><span class="row-body"><strong>'+esc(item.request)+'</strong><small>'+({quote:'待确认报价',copy:'待选择文案',done:'已交付'}[item.stage])+'</small></span>'+icon('next','chevron')+'</button>').join('')+'</section>':'')+'</main><section class="composer"><div class="compose-head"><h2>发起新需求</h2><button class="text-action" data-do="sample">填入示例</button></div>'+inputPanel(draft)+'</section>';
}
function draftPage(){
 return header('修改需求')+'<main class="detail"><h1>修改海报需求</h1><p class="intro">调整需求后，可以重新选择文案。</p><section class="group">'+inputPanel(editDraft,true)+'</section></main>';
}
function originalPage(){
 return header('工作记录')+'<main class="detail"><h1>原始需求</h1><section class="group"><p class="brief text-block">'+esc(current().request)+'</p></section></main><footer class="page-foot"><button class="primary" data-do="edit">修改需求</button></footer>';
}
function optionsPage(){
 const t=current();
 return header('文案选稿')+'<main class="detail"><h1>选择海报文案</h1><p class="intro">本地演示提供街角面包房的三组样稿。</p><div class="group summary"><small>你的需求</small><div class="text-block">'+esc(t.request)+'</div></div><div class="options" role="group" aria-label="选择一组文案">'+candidates.map((item,i)=>'<button class="option" data-choice="'+i+'" aria-pressed="'+(choice===i)+'"><span class="radio"></span><span class="option-copy"><small>'+labels[i]+'</small><strong>'+esc(item.title)+'</strong></span></button>').join('')+'</div><button class="text-action" data-do="edit">'+icon('edit')+'修改原始需求</button><section class="group"><h2>配套发布文案</h2><p class="copy-text">'+esc(candidates[0].cta)+'</p></section></main><footer class="page-foot"><button class="primary" data-do="choose">选好文案，查看报价</button></footer>';
}
function quotePage(){
 const t=current(),c=candidates[t.choice];
 return header('制作报价')+'<main class="detail"><h1>核对报价</h1><p class="intro">街角面包房 · 可颂出炉海报</p><div class="receipt"><div class="receipt-amount"><small>本次制作合计</small><strong>'+quote+'</strong><span>积分</span></div><div class="fact"><span>制作项目</span><b>海报 × 1</b></div><div class="fact"><span>已选文案</span><b>'+labels[t.choice]+'</b></div></div><section class="group"><h2>海报文案</h2><p class="copy-title">'+esc(c.title)+'</p><p class="copy-text">'+esc(c.cta)+'</p></section><p class="fine">本地样例仅演示确认流程，不会扣除积分。</p></main><footer class="page-foot"><div class="double"><button class="secondary" data-do="reselect">重新选稿</button><button class="primary" data-do="produce">确认制作 · '+quote+' 积分</button></div></footer>';
}
function chosenPage(){
 const t=current(),c=candidates[t.choice];
 return header('工作记录')+'<main class="detail"><h1>已选文案</h1><section class="group summary"><small>'+labels[t.choice]+'</small><p class="copy-title">'+esc(c.title)+'</p><p class="copy-text">'+esc(c.cta)+'</p></section></main><footer class="page-foot"><div class="double"><button class="secondary" data-do="reselect">重新选稿</button><button class="primary" data-do="resume">'+(t.stage==='done'?'查看交付':'核对报价')+'</button></div></footer>';
}
function previewPage(){
 const t=current(),poster=t.choice===1&&t.stage!=='copy';
 return header('样例预览')+'<main class="detail"><h1>'+(poster?'第二组海报小样':'面包房参考素材')+'</h1><img class="finished" src="'+(poster?art.poster:art.bakery)+'" alt="'+(poster?'第二组海报的完整样例':'可颂素材')+'"><p class="fine center">'+(poster?'街角面包房 · 第二组文案':'街角面包房 · 项目样例素材')+'</p></main><footer class="page-foot"><button class="primary" data-do="resume">'+({copy:'选择文案',quote:'核对报价',done:'查看交付'}[t.stage])+'</button></footer>';
}
function deliveryPage(){
 const t=current(),c=candidates[t.choice],real=t.choice===1;
 return header('任务交付')+'<main class="detail"><h1>海报与发布文案</h1><p class="intro">街角面包房 · '+labels[t.choice]+'</p><figure><img id="output" class="finished" '+(real?'src="'+art.poster+'"':'')+' alt="'+(real?'第二组海报成品':'选定文案的排版示意图')+'"><figcaption class="fine center">'+(real?'第二组海报样例':'本地排版示意 · 项目样例底图')+'</figcaption></figure><section class="group"><h2>发布文案</h2><p class="copy-title">'+esc(c.title)+'</p><p class="copy-text">'+esc(c.cta)+'</p><p id="copy-feedback" class="feedback" aria-live="polite"></p></section></main><footer class="page-foot"><div class="double"><button class="secondary" data-do="copy">复制文案</button><button class="primary" data-do="download" '+(!real?'disabled':'')+'>'+ (real?'保存海报':'保存排版示意图')+'</button></div><button class="text-action" style="justify-content:center" data-do="home">回到工作台</button></footer>';
}
const typefaces='-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif';
const examples=new Map();
async function layoutExample(index){
 if(examples.has(index))return examples.get(index);
 const image=new Image();image.src=art.bakery;await image.decode();
 const canvas=document.createElement('canvas');canvas.width=680;canvas.height=907;
 const ctx=canvas.getContext('2d'),c=candidates[index];
 ctx.fillStyle='#f4f2e8';ctx.fillRect(0,0,680,907);
 ctx.fillStyle='#233945';ctx.font='600 24px '+typefaces;ctx.fillText('响指出片   /   街角面包房',38,57);
 function drawLines(str,maxWidth,y,lineHeight){let line='';for(const ch of str){if(line&&ctx.measureText(line+ch).width>maxWidth){ctx.fillText(line,38,y);y+=lineHeight;line=''}line+=ch}if(line)ctx.fillText(line,38,y)}
 ctx.font='700 48px '+typefaces;drawLines(c.title,604,135,61);
 const sz=image.naturalWidth;ctx.drawImage(image,sz*.12,sz*.34,sz*.74,sz*.64,38,246,604,465);
 ctx.font='500 24px '+typefaces;drawLines(c.cta,599,773,36);
 ctx.font='500 18px '+typefaces;ctx.fillText('本地排版示意  /  '+labels[index],38,868);
 const result=canvas.toDataURL('image/jpeg',.92);examples.set(index,result);return result;
}
function render(){
 const screens={home,edit:draftPage,request:originalPage,options:optionsPage,quote:quotePage,'record-copy':chosenPage,preview:previewPage,delivery:deliveryPage};
 app.innerHTML=screens[screen]();
 const t=current();if(screen==='delivery'&&t.choice!==1){
  const out=document.querySelector('#output'),download=document.querySelector('[data-do=download]');
  layoutExample(t.choice).then(url=>{out.src=url;download.disabled=false}).catch(()=>{out.hidden=true;download.hidden=true;document.querySelector('figcaption').textContent='此组发布文案已就绪。'});
 }
}
function openOptions(){choice=current().choice;go('options')}
app.addEventListener('input',event=>{
 if(!event.target.hasAttribute('data-voice-input'))return;
 if(screen==='home')draft=event.target.value;else editDraft=event.target.value;
 document.querySelector('[data-do=send]').disabled=!event.target.value.trim();
});
app.addEventListener('click',async event=>{
 const button=event.target.closest('button');
 if(!button||button.disabled)return;
 const task=current();
 if(button.hasAttribute('data-task')){activeId=button.dataset.task;save();go('home');return}
 if(button.hasAttribute('data-choice')){choice=Number(button.dataset.choice);app.querySelectorAll('[data-choice]').forEach(el=>el.setAttribute('aria-pressed',el===button));return}
 switch(button.dataset.do){
 case 'back':
  if(screen==='edit')go(originPage);else go('home');break;
 case 'home':go('home');break;
 case 'preview':case 'request':case 'record-copy':case 'delivery':go(button.dataset.do);break;
 case 'resume':if(task.stage==='copy')openOptions();else go(task.stage==='done'?'delivery':'quote');break;
 case 'alternatives':case 'reselect': openOptions();break;
 case 'edit':originPage=screen;editDraft=task.request;go('edit');break;
 case 'sample':{const field=app.querySelector('[data-voice-input]');field.value=original;field.dispatchEvent(new Event('input',{bubbles:true}));field.focus();break}
 case 'send':{
  const request=app.querySelector('[data-voice-input]').value.trim();if(!request)return;
  if(screen==='edit'){task.request=request;task.stage='copy';editDraft=''}
  else{const id='local-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);records.unshift({id,request,choice:1,stage:'copy'});activeId=id;draft=''}
  save();openOptions();break;}
 case 'choose':task.choice=choice;task.stage='quote';save();go('quote');break;
 case 'produce':task.stage='done';save();go('delivery');break;
 case 'download':{const result=app.querySelector('#output').src;if(!result.startsWith('data:image/'))return;const a=document.createElement('a');a.href=result;a.download='街角面包房-'+labels[task.choice]+(task.choice===1?'海报':'排版示意')+'.jpg';document.body.append(a);a.click();a.remove();break}
 case 'copy':{
  const c=candidates[task.choice],str=c.title+'\n'+c.cta,feedback=app.querySelector('#copy-feedback');
  const field=document.createElement('textarea');field.value=str;field.setAttribute('aria-label','可复制的发布文案');field.setAttribute('readonly','');feedback.replaceChildren(field);field.select();
  let copied=false;try{copied=document.execCommand('copy')}catch{}
  if(copied){feedback.textContent='已复制发布文案。'}else{
   feedback.append('长按上方文字可复制。');
   try{await navigator.clipboard.writeText(str);feedback.textContent='已复制发布文案。'}catch{}
  }break;}
 }
});
render();
</script>
<script>
(() => {
  let current = null;
  const speechErrors = {
    "not-allowed": "麦克风未获授权。可以在浏览器设置中允许录音，或直接打字。",
    "service-not-allowed": "浏览器暂不能调用语音服务，可以直接打字。",
    "audio-capture": "没有检测到可用麦克风，可以连接后重试或打字。",
    "no-speech": "没有听清，可以再说一次，或直接打字。",
    network: "语音服务连接失败，可以重试或直接打字。",
    "language-not-supported": "当前语音服务不支持中文听写，可以直接打字。"
  };
  function finish(s, message) {
    if (s !== current) return;
    current = null;
    s.button.setAttribute("aria-pressed", "false");
    s.button.removeAttribute("data-listening");
    if (s.originalAria) s.button.setAttribute("aria-label", s.originalAria);
    else s.button.removeAttribute("aria-label");
    if (s.label) s.label.textContent = s.originalLabel;
    if (message && s.status.isConnected) s.status.textContent = message;
  }
  function cancel() {
    if (!current) return;
    const s = current;
    finish(s, "本次语音输入已结束。");
    try { s.rec.abort(); } catch {}
  }
  function visible(node) { return node && node.getClientRects().length > 0; }
  function visibleTarget(selector) {
    return [...document.querySelectorAll(selector)].find(visible);
  }
  document.addEventListener("click", e => {
    const button = e.target.closest("[data-voice-button]");
    if (!button) return;
    e.preventDefault();
    const label = button.querySelector("[data-voice-label]");
    const scope = button.closest("[data-voice-scope]") || document;
    const input = scope.querySelector("[data-voice-input]") || visibleTarget("[data-voice-input]");
    const status = scope.querySelector("[data-voice-status]") || visibleTarget("[data-voice-status]");
    if (!input || !status) return;
    if (current?.button === button) {
      status.textContent = "正在整理语音…";
      try { current.rec.stop(); } catch { cancel(); }
      return;
    }
    cancel();
    const Recognizer = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Recognizer || !window.isSecureContext) {
      status.textContent = "这个浏览器暂不支持语音转写。可以使用键盘听写，或直接输入文字。";
      input.focus();
      return;
    }
    let rec;
    try { rec = new Recognizer(); }
    catch { status.textContent = "语音服务暂时无法启动。可以直接输入文字。"; input.focus(); return; }
    const s = {rec, input, status, button, label, originalAria: button.getAttribute("aria-label"), originalLabel: label?.textContent, text: new Map()};
    current = s;
    rec.lang = "zh-CN";
    rec.continuous = false;
    rec.interimResults = true;
    const transcript = () => [...s.text.entries()].sort(([a],[b])=>a-b).map(([,v])=>v).join("").trim();
    rec.onstart = () => {
      if (current !== s) return;
      status.textContent = "在听，说完后点结束。";
    };
    rec.onresult = event => {
      if (current !== s) return;
      for (let i=event.resultIndex; i<event.results.length; i++) s.text.set(i,event.results[i][0].transcript);
      status.textContent = transcript() || "在听…";
    };
    rec.onerror = event => finish(s, speechErrors[event.error] || "语音输入中断，可以再试一次或直接打字。");
    rec.onend = () => {
      if (current !== s) return;
      if (!s.input.isConnected || !visible(button)) { finish(s); return; }
      const spoken = transcript();
      if (!spoken) { finish(s, "没有听到文字，可以再说一次或打字。"); return; }
      const max = s.input.maxLength > 0 ? s.input.maxLength : 1200;
      const combined = s.input.value + spoken;
      const draft = combined.slice(0, max);
      finish(s, combined.length > max ? "已达到字数上限，请核对草稿后发送。" : "已转成文字，可以修改后发送。");
      s.input.value = draft;
      s.input.dispatchEvent(new Event("input", {bubbles:true}));
    };
    status.textContent = "正在打开麦克风…";
    button.setAttribute("data-listening", "");
    button.setAttribute("aria-pressed", "true");
    button.setAttribute("aria-label", "结束语音输入");
    if (label) label.textContent = "结束录音";
    try { rec.start(); } catch { finish(s, "无法启动麦克风，可以重试或打字。"); }
  });
  new MutationObserver(() => {
    if (current && (!visible(current.button) || !current.input.isConnected)) cancel();
  }).observe(document.body, {subtree:true,childList:true,attributes:true,attributeFilter:["hidden","class","style"]});
  document.addEventListener("visibilitychange", () => { if (document.hidden) cancel(); });
  window.addEventListener("pagehide",cancel);
})();

</script>
