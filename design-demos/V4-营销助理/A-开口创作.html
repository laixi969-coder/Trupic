<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fafaf5"><title>开口创作 · 响指出片营销助理</title>
<style>
:root{--surface:#fafaf5;--ink:#153f2d;--soft:#55665a;--accent:#caed8b;--line:#d9dfd4;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:#e6e9df;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}body{margin:0}button,a,input,textarea{font:inherit}button{color:inherit;border:0;cursor:pointer;touch-action:manipulation}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #477948;outline-offset:3px}button:active,a:active{transform:scale(.98)}[hidden]{display:none!important}svg{display:block}p,h1,h2,h3{margin:0}
.phone{position:relative;max-width:430px;min-height:100vh;min-height:100dvh;margin:auto;background:var(--surface);display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;padding:13px 22px;min-height:71px;border-bottom:1px solid #dee3d9;flex:none}.brand{display:flex;align-items:center;gap:9px;white-space:nowrap}.brand img{width:32px;height:32px}.brand b{font-size:16px;letter-spacing:-.4px}.brand small{border-left:1px solid #bac6b7;padding-left:10px;color:#4e654f;font-weight:500;font-size:13px}.history-btn,.back{background:transparent;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:44px;font-size:14px}.history-btn svg{width:18px;height:18px}.back{margin-left:-10px}.back svg{width:20px;height:20px}
.home{flex:1;display:flex;flex-direction:column;padding:0 26px 17px}.intro{margin-top:clamp(26px,5vh,48px)}h1{font-weight:720;font-size:clamp(38px,11.3vw,47px);line-height:1.13;letter-spacing:-2.5px}.intro>p{margin-top:12px;color:#566b59;font-size:15px;line-height:1.6}
.example{position:relative;display:flex;align-items:center;gap:14px;text-align:left;margin-top:clamp(20px,3.6vh,34px);background:#f1f1e7;border:1px solid #dfe2d5;border-radius:6px 19px 19px 19px;padding:14px 15px 14px 17px;width:100%}.thumb{flex:none;width:65px;height:65px;overflow:hidden;position:relative;transform:rotate(4deg);border:3px solid #fff;box-shadow:0 1px 3px #152d1f28;border-radius:2px}.thumb img{width:100%;height:100%;object-fit:cover;transform:scale(1.88);transform-origin:50% 86%}.example-copy{flex:1;min-width:0}.example .kicker{display:block;font-size:12px;color:#566351;margin-bottom:5px}.example strong{display:block;font-size:15px;line-height:1.5;font-weight:600}.example>svg{width:16px;height:16px;flex:none}
.record{flex:1;min-height:225px;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:22px 0 16px}.stage{position:relative;height:182px;width:calc(100% + 52px);display:grid;place-items:center;isolation:isolate;overflow:hidden}.wave{position:absolute;left:50%;top:50%;width:100%;height:96px;transform:translate(-50%,-50%);z-index:-3}.stage::before,.stage::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%;z-index:-2}.stage::before{width:180px;height:180px;border:.9px solid #dbe7c9;background:var(--surface)}.stage::after{width:160px;height:160px;background:#e5f0d0;border:1px solid #d5e6ba}
.mic{display:grid;place-items:center;align-content:center;gap:4px;border-radius:50%;width:137px;height:137px;background:radial-gradient(ellipse at 37% 18%,#dcf8a4 0%,#c8ed84 58%,#b7df70 100%);border:1px solid #afd177;box-shadow:inset 0 2px 1px #f4ffd8ba,inset 0 -4px 5px #94b45266,0 5px 9px #50692929;font-size:14px;font-weight:650;letter-spacing:.2px}.mic svg{width:42px;height:42px}.mic[aria-pressed="true"]{background:#c3e86e;box-shadow:0 0 0 6px #d2eab2}.voice-status{margin:7px 0 0;text-align:center;min-height:19px;color:#5d6d5a;font-size:13px;line-height:1.5;max-width:100%}
.compose{flex:none;margin-top:auto;padding-bottom:max(0px,env(safe-area-inset-bottom))}.field{display:flex;align-items:flex-end;gap:9px;min-height:58px;padding:7px 7px 7px 14px;border:1px solid #cfd6c8;border-radius:19px;background:#fff;box-shadow:0 2px 6px #35482906}.field:focus-within{border-color:#6e8a63}.field>svg{flex:none;width:20px;height:20px;color:#647664;align-self:center}.field textarea{color:var(--ink);background:transparent;border:0;outline:0;resize:none;flex:1;min-width:0;font-size:16px;line-height:23px;padding:10px 0;max-height:96px;height:43px;scrollbar-width:thin}.field textarea:focus-visible{outline:none}.field textarea::placeholder{color:#677866}.send{width:44px;height:44px;flex:none;background:var(--ink);color:white;display:grid;place-items:center;border-radius:14px}.send svg{width:21px;height:21px}.local-note{color:#657262;text-align:center;font-size:12px;line-height:1.5;margin-top:10px}
.flow,.history{padding:28px 25px max(25px,env(safe-area-inset-bottom));flex:1;display:flex;flex-direction:column}.flow h2,.history h2{font-size:32px;line-height:1.17;letter-spacing:-1.3px;margin-bottom:11px}.flow .subtitle,.history .subtitle{color:var(--soft);font-size:14px;line-height:1.6}.flow .breadcrumb{color:#5b705d;display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:22px}.trail{display:inline-block;width:26px;height:3px;background:#304f37;border-radius:4px}.trail.todo{background:#dce1d3}.brief{border:0;border-radius:6px 16px 16px 16px;background:#edf1e5;padding:12px 14px;margin:17px 0 14px;font-size:14px;line-height:1.6;overflow-wrap:anywhere}.brief span,.quote small,.receipt dt,.receipt dd small{display:block;font-size:12px;font-weight:500;color:var(--soft);margin-bottom:4px}.choices{margin:8px 0 17px}.choice{background:transparent;border-bottom:1px solid var(--line);display:flex;align-items:center;text-align:left;gap:11px;padding:16px 0;width:100%}.choice:first-child{border-top:1px solid var(--line)}.choice>span:first-child{width:21px;height:21px;flex:none;border:1.5px solid #9aa998;border-radius:50%;display:grid;place-items:center}.choice.selected>span:first-child{border-color:var(--ink);background:var(--ink)}.choice.selected>span:first-child::after{content:"";width:7px;height:7px;background:var(--accent);border-radius:50%}.choice b,.choice small{display:block}.choice b{font-size:16px;line-height:1.45}.choice small{margin-top:2px;color:var(--soft);font-size:13px}
.actions{margin-top:auto;padding-top:13px;display:grid;gap:5px}.primary,.secondary,.plain{width:100%;display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:14px;font-size:15px;font-weight:600;text-decoration:none;text-align:center}.primary{background:var(--ink);color:#fff}.secondary{background:#e8efdd}.plain{background:transparent}.quote{background:#edf2e1;padding:19px 19px 20px;margin:22px 0 8px;border-radius:7px 20px 20px 20px}.quote h3{font-size:22px;line-height:1.4;letter-spacing:-.6px}.quote p{margin-top:8px;font-size:14px;line-height:1.6;color:#476047}.receipt{margin:14px 0 20px}.receipt div{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}.receipt dt,.receipt dd{margin:0}.receipt dt{font-size:14px}.receipt dd{font-size:15px;font-weight:600}.receipt dd b{font-size:25px}.receipt dd small{display:inline;font-size:14px;margin-left:4px}.poster{display:block;width:min(100%,248px);height:auto;margin:18px auto 10px;border-radius:4px}.history-list{margin-top:20px;display:grid;gap:2px}.history-item{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;background:transparent;border-bottom:1px solid var(--line);text-align:left;padding:10px 0}.history-item>span{flex:1;min-width:0}.history-item b{display:block;font-size:15px;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.history-item small{font-size:12px;color:var(--soft)}.history-item svg{width:18px;height:18px}.empty{margin:28px 0;color:var(--soft);font-size:15px}.toast{position:fixed;z-index:8;left:50%;bottom:18px;width:max-content;max-width:calc(100vw - 48px);transform:translateX(-50%);color:white;background:var(--ink);border-radius:10px;padding:9px 13px;font-size:13px}.toast:empty{display:none}.defs{display:none}
@media(min-width:480px){.phone{box-shadow:0 0 36px #18321c10}}@media(max-height:700px){.intro{margin-top:22px}.example{margin-top:17px}.record{min-height:190px;padding:7px 0}.stage{height:160px}.stage::before{width:151px;height:151px}.stage::after{width:140px;height:140px}.mic{width:122px;height:122px}.local-note{margin-top:6px}.top{min-height:60px;padding-block:8px}}@media(max-width:340px){.home{padding-inline:18px}.stage{width:calc(100% + 36px)}.brand small{display:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style><style>h1,h2,h3{font-family:"PingFang SC","Microsoft YaHei",sans-serif}</style></head>

const storageKey='trupic-demo-voice-first-v4';
const $=id=>document.getElementById(id);
const icon=id=>'<svg aria-hidden="true"><use href="#'+id+'"/></svg>';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let records=[];
try{const parsed=JSON.parse(localStorage.getItem(storageKey)||'[]');if(Array.isArray(parsed))records=parsed.filter(t=>t&&typeof t.brief==='string'&&Number.isInteger(t.selected)&&t.selected>=0&&t.selected<copy.length&&['choices','price','done'].includes(t.phase))}catch{}
let screen='home',previous='home',task=null,timer;

 $('home').hidden=next!=='home';$('flow').hidden=next!=='flow';$('history').hidden=next!=='history';
 $('back').hidden=next==='home';$('logo').hidden=next!=='home';$('historyBtn').hidden=next==='history';
 if(next==='flow')renderFlow();
 if(next==='history')renderHistory();
 if(next==='home')resize();
 window.scrollTo(0,0);
}
function selectExample(){task=null;$('draft').value=sample;openScreen('home');$('draft').focus();$('draft').setSelectionRange(sample.length,sample.length);say('示例已填入，可以修改后发送')}
function newDraft(){task=null;$('draft').value='';openScreen('home')}
function edit(){if(task)$('draft').value=task.brief;openScreen('home');$('draft').focus()}
$('form').addEventListener('submit',e=>{e.preventDefault();const brief=$('draft').value.trim();if(!brief){$('draft').focus();say('先说一句或输入宣传需求');return}
 if(!task||task.phase==='done')task={id:Date.now()+'-'+Math.random().toString(36).slice(2,6),brief,selected:0,phase:'choices'};
 else{task={...task,brief,phase:'choices'}}
 store();openScreen('flow');
});
$('draft').addEventListener('input',resize);$('draft').addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter')$('form').requestSubmit()});
$('example').onclick=selectExample;$('historyBtn').onclick=()=>{previous=screen;openScreen('history')};
$('back').onclick=()=>{if(screen==='history'){openScreen(previous);return}
 if(!task){openScreen('home');return}
 if(task.phase==='price'){task.phase='choices';store();openScreen('flow')}
 else if(task.phase==='done'){openScreen('home');$('draft').value='';task=null;resize()}
 else edit();
};
function breadcrumb(n,label){return '<p class="breadcrumb">'+[1,2,3].map(x=>'<span aria-hidden="true" class="trail '+(x>n?'todo':'')+'"></span>').join('')+label+'</p>'}
function action(id,label,cls='primary'){return '<button type="button" data-act="'+id+'" class="'+cls+'">'+label+'</button>'}
function renderFlow(){
 const c=copy[task.selected];let html='';
 if(task.phase==='choices'){
 html=breadcrumb(1,'选择文案')+'<h2>哪一句更合适？</h2><p class="subtitle">这里有三句面包房示例标题，选好后就能查看报价。</p><div class="brief"><span>你的需求</span>'+esc(task.brief)+'</div><div class="choices" aria-label="示例文案">'+copy.map((d,i)=>'<button aria-pressed="'+(i===task.selected)+'" class="choice '+(i===task.selected?'selected':'')+'" type="button" data-choice="'+i+'"><span aria-hidden="true"></span><span><small>第'+['一','二','三'][i]+'组</small><b>'+esc(d.title)+'</b></span></button>').join('')+'</div><div class="actions">'+action('price','查看报价')+action('edit','修改需求','plain')+'</div>';
 }else if(task.phase==='price'){
 html=breadcrumb(2,'核对积分')+'<h2>核对这次出片</h2><p class="subtitle">确认文案和示例费用后，查看交付内容。</p><div class="quote"><small>所选标题</small><h3>'+esc(c.title)+'</h3><p>'+esc(c.cta)+'</p></div><dl class="receipt"><div><dt>项目</dt><dd>面包房海报</dd></div><div><dt>样例报价</dt><dd><b>4</b><small>积分</small></dd></div></dl><p class="subtitle">本地体验不会扣除积分。</p><div class="actions">'+action('done','确认 4 积分，查看交付')+action('choose','返回选稿','plain')+'</div>';
 }else{
 const real=task.selected===1;
 html=breadcrumb(3,'查看交付')+'<h2>'+(real?'海报已就绪':'文案已就绪')+'</h2><p class="subtitle">'+(real?'第二组验收样例，可保存海报或复制发布文案。':'这组示例提供发布文案，可复制使用。')+'</p>'+(real?'<img class="poster" src="'+poster+'" alt="第二组街角面包房可颂海报">':'')+'<div class="quote"><small>发布文案</small><h3>'+esc(c.title)+'</h3><p>'+esc(c.cta)+'</p></div><div class="actions">'+(real?'<a class="primary" download="街角面包房-第二组.jpg" href="'+poster+'">保存示例海报</a>':'')+action('copy','复制发布文案',real?'secondary':'primary')+action('choose','返回选稿','plain')+action('new','开始新需求','plain')+'</div>';
 }
 $('flow').innerHTML=html;
}
async function copyText(){
 const c=copy[task.selected],value=c.title+'\n'+c.cta;
 try{await navigator.clipboard.writeText(value);say('已复制发布文案');return}catch{}
 const field=document.createElement('textarea');field.value=value;field.style.cssText='position:fixed;left:0;top:0;opacity:0';document.body.append(field);field.select();
 let ok=false;try{ok=document.execCommand('copy')}catch{}field.remove();say(ok?'已复制发布文案':'可长按发布文案来复制');
}
$('flow').onclick=e=>{const b=e.target.closest('button');if(!b)return;
 if(b.hasAttribute('data-choice')){task.selected=Number(b.dataset.choice);store();renderFlow();$('flow').querySelector('[data-choice="'+task.selected+'"]').focus({preventScroll:true});return}
 switch(b.dataset.act){case 'price':task.phase='price';break;case 'done':task.phase='done';break;case 'choose':task.phase='choices';break;case 'edit':edit();return;case 'new':newDraft();return;case 'copy':copyText();return;default:return}store();openScreen('flow');
};
function renderHistory(){
 $('history').innerHTML='<h2>创作记录</h2><p class="subtitle">这台设备上最近的示例任务</p>'+(records.length?'<div class="history-list">'+records.map((r,i)=>'<button class="history-item" data-record="'+i+'"><span><b>'+esc(r.brief)+'</b><small>'+({choices:'待选文案',price:'待核对积分',done:'已交付'}[r.phase])+'</small></span>'+icon('i-right')+'</button>').join('')+'</div>':'<p class="empty">发送第一个需求后，可以从这里继续。</p>')+'<div class="actions">'+action('home','返回创作','secondary')+'</div>';
}
$('history').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-record')){task={...records[Number(b.dataset.record)]};openScreen('flow')}else openScreen(previous)};
</script>
<script>
(() => {
  let current = null;
  const speechErrors = {
    "not-allowed": "麦克风未获授权。可以在浏览器设置中允许录音，或直接打字。",
    "service-not-allowed": "浏览器暂不能调用语音服务，可以直接打字。",
    "audio-capture": "没有检测到可用麦克风，可以连接后重试或打字。",
    "no-speech": "没有听清，可以再说一次，或直接打字。",
    network: "语音服务连接失败，可以重试或直接打字。",
    "language-not-supported": "当前语音服务不支持中文听写，可以直接打字。"
  };
  function finish(s, message) {
    if (s !== current) return;
    current = null;
    s.button.setAttribute("aria-pressed", "false");
    s.button.removeAttribute("data-listening");
    if (s.originalAria) s.button.setAttribute("aria-label", s.originalAria);
    else s.button.removeAttribute("aria-label");
    if (s.label) s.label.textContent = s.originalLabel;
    if (message && s.status.isConnected) s.status.textContent = message;
  }
  function cancel() {
    if (!current) return;
    const s = current;
    finish(s, "本次语音输入已结束。");
    try { s.rec.abort(); } catch {}
  }
  function visible(node) { return node && node.getClientRects().length > 0; }
  function visibleTarget(selector) {
    return [...document.querySelectorAll(selector)].find(visible);
  }
  document.addEventListener("click", e => {
    const button = e.target.closest("[data-voice-button]");
    if (!button) return;
    e.preventDefault();
    const label = button.querySelector("[data-voice-label]");
    const scope = button.closest("[data-voice-scope]") || document;
    const input = scope.querySelector("[data-voice-input]") || visibleTarget("[data-voice-input]");
    const status = scope.querySelector("[data-voice-status]") || visibleTarget("[data-voice-status]");
    if (!input || !status) return;
    if (current?.button === button) {
      status.textContent = "正在整理语音…";
      try { current.rec.stop(); } catch { cancel(); }
      return;
    }
    cancel();
    const Recognizer = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Recognizer || !window.isSecureContext) {
      status.textContent = "这个浏览器暂不支持语音转写。可以使用键盘听写，或直接输入文字。";
      input.focus();
      return;
    }
    let rec;
    try { rec = new Recognizer(); }
    catch { status.textContent = "语音服务暂时无法启动。可以直接输入文字。"; input.focus(); return; }
    const s = {rec, input, status, button, label, originalAria: button.getAttribute("aria-label"), originalLabel: label?.textContent, text: new Map()};
    current = s;
    rec.lang = "zh-CN";
    rec.continuous = false;
    rec.interimResults = true;
    const transcript = () => [...s.text.entries()].sort(([a],[b])=>a-b).map(([,v])=>v).join("").trim();
    rec.onstart = () => {
      if (current !== s) return;
      status.textContent = "在听，说完后点结束。";
    };
    rec.onresult = event => {
      if (current !== s) return;
      for (let i=event.resultIndex; i<event.results.length; i++) s.text.set(i,event.results[i][0].transcript);
      status.textContent = transcript() || "在听…";
    };
    rec.onerror = event => finish(s, speechErrors[event.error] || "语音输入中断，可以再试一次或直接打字。");
    rec.onend = () => {
      if (current !== s) return;
      if (!s.input.isConnected || !visible(button)) { finish(s); return; }
      const spoken = transcript();
      if (!spoken) { finish(s, "没有听到文字，可以再说一次或打字。"); return; }
      const max = s.input.maxLength > 0 ? s.input.maxLength : 1200;
      const combined = s.input.value + spoken;
      const draft = combined.slice(0, max);
      finish(s, combined.length > max ? "已达到字数上限，请核对草稿后发送。" : "已转成文字，可以修改后发送。");
      s.input.value = draft;
      s.input.dispatchEvent(new Event("input", {bubbles:true}));
    };
    status.textContent = "正在打开麦克风…";
    button.setAttribute("data-listening", "");
    button.setAttribute("aria-pressed", "true");
    button.setAttribute("aria-label", "结束语音输入");
    if (label) label.textContent = "结束录音";
    try { rec.start(); } catch { finish(s, "无法启动麦克风，可以重试或打字。"); }
  });
  new MutationObserver(() => {
    if (current && (!visible(current.button) || !current.input.isConnected)) cancel();
  }).observe(document.body, {subtree:true,childList:true,attributes:true,attributeFilter:["hidden","class","style"]});
  document.addEventListener("visibilitychange", () => { if (document.hidden) cancel(); });
  window.addEventListener("pagehide",cancel);
})();

</script>
</body></html>
